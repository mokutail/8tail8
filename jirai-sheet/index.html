<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>地雷シートメーカー</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#a3315e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 左で項目にチェック、右に完成画像。スマホでは上のタブで切りかえ */
:root {
  --bg: #f1f2ee; --panel: #ffffff; --ink: #23262c; --ink-2: #646872; --line: #d9dbd5;
  --accent: #a3315e; --accent-ink: #ffffff; --accent-wash: #f6e4ea; --paper: #fbfbf8;
  --display: "Zen Antique", "Hiragino Mincho ProN", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171b; --panel: #1e2126; --ink: #e8e9ec; --ink-2: #a2a6af; --line: #343840; --accent: #e0709c; --accent-ink: #1a0f14; --accent-wash: #3a2330; --paper: #191b1f; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* 8tail8 tools へ戻る(ほかの道具と同じ) */
.home-link { display: inline-block; font-size: 13px; color: var(--ink-2); text-decoration: none; padding-top: 14px; }
.home-link:hover { color: var(--accent); }
header.top { padding-block: 22px 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .04em; }
h1 small { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-2); letter-spacing: 0; margin-top: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar .now { font-size: 13px; color: var(--ink-2); margin-right: auto; }
.toolbar .now b { color: var(--ink); }
.tbtn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
.tbtn:hover { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px 10px; margin-bottom: 14px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 8px 0 4px; display: flex; justify-content: space-between; align-items: center; }
.saved-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.saved-row .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-row .d { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 6px; }
.saved-row .cur { font-size: 11px; background: var(--accent-wash); color: var(--accent); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
.mini { border: 1.5px solid var(--line); background: none; border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
.mini.sure { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.tabs { display: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.form { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label.f { display: block; font-size: 13px; font-weight: 700; margin: 0 0 4px; }
input[type="text"] { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--paper); border-radius: 9px; padding: 7px 10px; font-size: 15px; }
input[type="text"]:focus { border-color: var(--accent); outline: none; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 1.5px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 2.5px var(--ink); }
.sw-custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
input[type="color"] { width: 38px; height: 34px; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px; background: var(--paper); }

.mycolors { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.mc { position: relative; display: inline-flex; }
.mc-x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 11px; line-height: 18px; padding: 0; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 7px 10px; background: var(--paper); }
.quick input { padding: 5px 9px; font-size: 14px; }
.small { font-size: 13.5px; }
.modebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--line); border-radius: 10px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 13.5px; }
.seg button.on { background: var(--panel); }
.count { font-size: 13px; color: var(--ink-2); }
.count b { color: var(--accent); }

.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cat-h { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.cat-h .name { flex: 1; font-weight: 700; min-width: 0; }
.cat-h .n { font-size: 12px; color: var(--ink-2); }
.cat-h input { flex: 1; font-weight: 700; }
.colsel { display: inline-flex; gap: 2px; }
.colsel button, .icon { border: 1.5px solid var(--line); background: none; border-radius: 7px; padding: 2px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.colsel button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.icon:hover { border-color: var(--accent); color: var(--accent); }
.it { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 14px; }
.it:last-child { border-bottom: 0; }
.it:hover { background: var(--paper); }
.box { width: 22px; height: 22px; border: 2px solid var(--ink-2); border-radius: 4px; display: grid; place-items: center; }
.it.on .box { background: var(--sheet); border-color: var(--sheet); }
.it.on .box svg { display: block; }
.box svg { display: none; width: 15px; height: 15px; }
.it.on .txt { font-weight: 700; }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 6px; padding: 5px 10px; border-bottom: 1px solid var(--line); }
.ed input { padding: 5px 8px; font-size: 14px; }
.x { border: 0; background: none; color: var(--ink-2); border-radius: 7px; font-size: 17px; }
.x:hover { background: var(--accent-wash); color: var(--accent); }
.add { margin: 8px 10px; border: 1.5px dashed var(--line); background: none; border-radius: 8px; padding: 4px 12px; font-size: 13px; color: var(--ink-2); }
.add:hover { border-color: var(--accent); color: var(--accent); }

.out { position: sticky; top: 12px; min-width: 0; }
.out-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.out-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.out-head .meta { font-size: 12.5px; color: var(--ink-2); }
.save { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 18px; font-weight: 700; font-size: 14.5px; }
.canvas-wrap { padding: 14px; background: var(--paper); }
canvas { display: block; width: 100%; height: auto; box-shadow: 0 1px 6px rgba(0, 0, 0, .12); background: #fff; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 10px 2px 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; z-index: 20; }
.fab { display: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }

@media (max-width: 860px) {
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--line); padding: 4px; border-radius: 12px; margin-bottom: 12px; position: sticky; top: 0; z-index: 5; }
  .tabs button { border: 0; border-radius: 9px; padding: 8px; font-weight: 700; background: none; }
  .tabs button.on { background: var(--panel); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .cols[data-view="form"] .out { display: none; }
  .cols[data-view="out"] .form { display: none; }
  .out { position: static; }
  .fab { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="../">← 8tail8 tools</a>
  <header class="top"><h1>地雷シートメーカー<small>含まれる要素にチェックすると、BOOTHやXに載せる「地雷・注意事項チェックシート」の画像ができます</small></h1></header>
  <div class="toolbar" id="toolbar"></div>
  <div class="panel" id="saved-panel" hidden></div>
  <div class="tabs" role="tablist" aria-label="表示の切りかえ">
    <button class="on" data-view="form" role="tab" aria-selected="true">チェック</button>
    <button data-view="out" role="tab" aria-selected="false">できあがり</button>
  </div>
  <div class="cols" id="cols" data-view="form">
    <div class="form" id="form"></div>
    <aside class="out" aria-label="できあがり">
      <div class="out-card">
        <div class="out-head"><span class="meta" id="meta"></span><button type="button" class="save" id="dl">画像を保存</button></div>
        <div class="canvas-wrap"><canvas id="sheet" width="1240" height="1754" role="img" aria-label="地雷・注意事項チェックシートの画像"></canvas></div>
      </div>
      <p class="note">A4と同じ縦横の比率(1240×1754)のPNGで保存します。入力した内容は自動で保存され、「保存したシート」から開きなおせます。保存先はこのブラウザの中だけです。</p>
    </aside>
  </div>
</div>
<button type="button" class="save fab" id="dl2">画像を保存</button>
<script type="module" src="app.js"></script>
</body>
</html>
