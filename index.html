<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>8tail8 tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  :root { --bg: #f1f2ee; --panel: #fff; --ink: #23262c; --ink-2: #646872; --line: #d9dbd5; --accent: #a3315e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171b; --panel: #1e2126; --ink: #e8e9ec; --ink-2: #a2a6af; --line: #343840; --accent: #e0709c; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; line-height: 1.6; padding: 40px max(16px, env(safe-area-inset-left)) 60px; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-family: "Zen Antique", serif; font-weight: 400; font-size: 30px; margin: 0 0 4px; }
  p.lead { color: var(--ink-2); margin: 0 0 24px; }
  a.tool { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: inherit; text-decoration: none; }
  a.tool:hover { border-color: var(--accent); }
  a.tool b { font-size: 17px; }
  a.tool span { display: block; color: var(--ink-2); font-size: 14px; }
  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<main>
  <h1>8tail8 tools</h1>
  <p class="lead">シナリオづくりと配布に使う道具。</p>
  <ul>
    <li><a class="tool" href="booth-maker/"><b>BOOTH説明文メーカー</b><span>シナリオの情報を入れると、BOOTHの商品説明に貼れる文章ができます</span></a></li>
  </ul>
</main>
</body>
</html>
